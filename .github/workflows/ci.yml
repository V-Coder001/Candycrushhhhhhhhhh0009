name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  logic-tests:
    name: Spiellogik (swift test, Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test Match3Core
        working-directory: Match3Core
        run: swift test

  ios-build:
    name: iOS-App bauen (Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build
        run: |
          xcodebuild build \
            -project Soett.xcodeproj \
            -scheme Soett \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
